<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#131313"/>
    </linearGradient>
  </defs>

  <!-- Dark Engineering Grid Canvas -->
  <rect width="800" height="1000" fill="#111111" />
  <rect width="800" height="1000" fill="url(#grid)" />

  <!-- Top Margin Red Accent Line -->
  <line x1="30" y1="0" x2="30" y2="1000" stroke="#E52532" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Header Card -->
  <g transform="translate(40, 25)">
    <rect width="720" height="110" rx="10" fill="url(#headerGrad)" stroke="#333333" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#E52532" />
    <text x="25" y="36" fill="#E52532" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="2">[BEENEXT HANDWRITTEN DSA NOTES]</text>
    <text x="25" y="70" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="800">Bubble Sort — Adjacent Comparison & Optimization</text>
    <text x="25" y="94" fill="#A0A0A0" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14">Bubbling Max Elements to the Right • Category: Sorting</text>
  </g>

  <!-- Step By Step Trace Visuals -->
  
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">1. Outer Pass Loop (0 to N-1)</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">for (int i = 0; i < n - 1; i++) { boolean swapped = false; ... }</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">After pass 'i', the largest 'i' elements are locked in their final positions.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">OUTER PASS</text>
    </g>

    <g transform="translate(40, 275)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">2</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">2. Inner Adjacent Pairs Comparison</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">for (int j = 0; j < n - i - 1; j++) if (arr[j] > arr[j + 1]) swap(j, j+1)</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Compare side-by-side neighbors and bubble the heavier element forward.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">COMPARE</text>
    </g>

    <g transform="translate(40, 390)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">3</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">3. Swap Detection & Early Exit</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">if (!swapped) break;</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Optimization: If no swaps occurred in a pass, array is already sorted! O(N) best case.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">EARLY EXIT</text>
    </g>

    <g transform="translate(40, 505)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">4</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">4. Redundant Comparison Reduction</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">Limit inner loop to n - i - 1 instead of n - 1</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Never re-check the sorted right suffix.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">EFFICIENCY</text>
    </g>

    <g transform="translate(40, 620)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">5</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">5. Stability Check</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">if (arr[j] > arr[j + 1]) vs arr[j] >= arr[j + 1]</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Strict inequality '>' preserves relative ordering of equal values.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">STABILITY</text>
    </g>

  <!-- Complexity Summary Box -->
  <g transform="translate(40, 770)">
    <rect width="720" height="95" rx="8" fill="#161616" stroke="#E52532" stroke-width="1.5"/>
    <text x="20" y="32" fill="#E52532" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">⚡ COMPLEXITY &amp; INVARIANTS</text>
    <text x="20" y="60" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13">Time: Best=O(N) [With swapped flag optimization] | Avg=O(N^2) | Worst=O(N^2) [Reverse sorted]</text>
    <text x="20" y="80" fill="#AAAAAA" font-family="'Courier New', monospace" font-size="13">Space: Aux Space=O(1) [Auxiliary space] | In-Place=YES | Stable=YES</text>
  </g>

  <!-- Handwritten Tips Footer -->
  <g transform="translate(40, 885)">
    <rect width="720" height="85" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
    <text x="20" y="28" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">💡 KEY INTERVIEW MENTAL MODEL:</text>
    <text x="20" y="52" fill="#C0C0C0" font-family="'Courier New', monospace" font-size="12">REAL-WORLD USE: Primarily educational; occasionally used when data is nearly sorted.</text>
    <text x="20" y="72" fill="#E52532" font-family="'Courier New', monospace" font-size="12">WATCH OUT: Without the 'swapped' flag, best case degrades unnecessarily to O(N^2).</text>
  </g>
</svg>