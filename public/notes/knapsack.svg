<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#131313"/>
    </linearGradient>
  </defs>

  <!-- Dark Engineering Grid Canvas -->
  <rect width="800" height="1000" fill="#111111" />
  <rect width="800" height="1000" fill="url(#grid)" />

  <!-- Top Margin Red Accent Line -->
  <line x1="30" y1="0" x2="30" y2="1000" stroke="#E52532" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Header Card -->
  <g transform="translate(40, 25)">
    <rect width="720" height="110" rx="10" fill="url(#headerGrad)" stroke="#333333" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#E52532" />
    <text x="25" y="36" fill="#E52532" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="2">[BEENEXT HANDWRITTEN DSA NOTES]</text>
    <text x="25" y="70" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="800">0/1 Knapsack — 2D DP Table & State Equations</text>
    <text x="25" y="94" fill="#A0A0A0" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14">Optimal Substructure & Overlapping Subproblems • Category: Dynamic Programming</text>
  </g>

  <!-- Step By Step Trace Visuals -->
  
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">1. State Definition</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">dp[i][w] = Maximum profit using first 'i' items with knapsack capacity 'w'</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Two dimensions: Item choices (0..N) and capacity levels (0..W).</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">DP STATE</text>
    </g>

    <g transform="translate(40, 275)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">2</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">2. Base Case Initialization</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">dp[0][w] = 0; dp[i][0] = 0;</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Zero items yields 0 profit; zero capacity can hold 0 items.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">BASE CASES</text>
    </g>

    <g transform="translate(40, 390)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">3</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">3. Decision Tree: Exclude Item 'i'</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">excludeProfit = dp[i - 1][w];</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">If we don't take item 'i', best profit is simply using previous items.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">EXCLUDE</text>
    </g>

    <g transform="translate(40, 505)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">4</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">4. Decision Tree: Include Item 'i' (If wt <= w)</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">includeProfit = val[i - 1] + dp[i - 1][w - wt[i - 1]];</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Gain item profit plus best profit for the remaining capacity (w - wt).</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">INCLUDE</text>
    </g>

    <g transform="translate(40, 620)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">5</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">5. Transition Equation</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">dp[i][w] = Math.max(excludeProfit, includeProfit);</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Pick the optimal strategy at each state.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">TRANSITION</text>
    </g>

  <!-- Complexity Summary Box -->
  <g transform="translate(40, 770)">
    <rect width="720" height="95" rx="8" fill="#161616" stroke="#E52532" stroke-width="1.5"/>
    <text x="20" y="32" fill="#E52532" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">⚡ COMPLEXITY &amp; INVARIANTS</text>
    <text x="20" y="60" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13">Time: Best=O(N * W) | Avg=O(N * W) | Worst=O(N * W) [Pseudo-polynomial]</text>
    <text x="20" y="80" fill="#AAAAAA" font-family="'Courier New', monospace" font-size="13">Space: Aux Space=O(N * W) [Can be optimized to O(W) with 1D array] | In-Place=NO | Stable=YES</text>
  </g>

  <!-- Handwritten Tips Footer -->
  <g transform="translate(40, 885)">
    <rect width="720" height="85" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
    <text x="20" y="28" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">💡 KEY INTERVIEW MENTAL MODEL:</text>
    <text x="20" y="52" fill="#C0C0C0" font-family="'Courier New', monospace" font-size="12">SPACE OPTIMIZATION: Notice dp[i][w] only depends on row (i-1); reduce to 1D array traversing backwards!</text>
    <text x="20" y="72" fill="#E52532" font-family="'Courier New', monospace" font-size="12">WHY BACKWARDS? Right-to-left traversal prevents using the same item multiple times in 0/1.</text>
  </g>
</svg>