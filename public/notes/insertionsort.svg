<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#131313"/>
    </linearGradient>
  </defs>

  <!-- Dark Engineering Grid Canvas -->
  <rect width="800" height="1000" fill="#111111" />
  <rect width="800" height="1000" fill="url(#grid)" />

  <!-- Top Margin Red Accent Line -->
  <line x1="30" y1="0" x2="30" y2="1000" stroke="#E52532" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Header Card -->
  <g transform="translate(40, 25)">
    <rect width="720" height="110" rx="10" fill="url(#headerGrad)" stroke="#333333" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#E52532" />
    <text x="25" y="36" fill="#E52532" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="2">[BEENEXT HANDWRITTEN DSA NOTES]</text>
    <text x="25" y="70" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="800">Insertion Sort — Playing Card Mental Model</text>
    <text x="25" y="94" fill="#A0A0A0" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14">Adaptive Linear Time for Nearly Sorted Data • Category: Sorting</text>
  </g>

  <!-- Step By Step Trace Visuals -->
  
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">1. Assume First Element is Sorted Hand</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">for (int i = 1; i < n; i++) int key = arr[i]; int j = i - 1;</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Extract the next card 'key' to be inserted into the sorted hand on the left.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">KEY EXTRACTION</text>
    </g>

    <g transform="translate(40, 275)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">2</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">2. Shift Greater Elements Rightwards</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">while (j >= 0 && arr[j] > key) { arr[j + 1] = arr[j]; j--; }</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Shift cards right one-by-one to create an empty vacancy slot.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">SHIFT</text>
    </g>

    <g transform="translate(40, 390)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">3</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">3. Insert Key into Created Slot</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">arr[j + 1] = key;</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">Drop the key into its precise sorted position.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">INSERT</text>
    </g>

    <g transform="translate(40, 505)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">4</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">4. Adaptive Early Termination</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">If arr[j] <= key, inner loop immediately halts on first comparison!</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">If array is already sorted, runs in blazing O(N) total time.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">ADAPTIVE</text>
    </g>

    <g transform="translate(40, 620)">
      <rect x="0" y="0" width="720" height="95" rx="8" fill="#181818" stroke="#2D2D2D" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="#E52532" />
      <text x="28" y="33" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="middle">5</text>
      <text x="56" y="32" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, sans-serif" font-size="15" font-weight="bold">5. Online Algorithm Feature</text>
      <text x="56" y="56" fill="#C5C5C5" font-family="'Courier New', monospace" font-size="13">Can sort streaming data in real-time as numbers arrive</text>
      <text x="56" y="78" fill="#999999" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12">No need to know total size N in advance.</text>
      <rect x="610" y="14" width="95" height="24" rx="4" fill="#2E1114" stroke="#E52532" stroke-width="1"/>
      <text x="657" y="30" fill="#E52532" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">ONLINE</text>
    </g>

  <!-- Complexity Summary Box -->
  <g transform="translate(40, 770)">
    <rect width="720" height="95" rx="8" fill="#161616" stroke="#E52532" stroke-width="1.5"/>
    <text x="20" y="32" fill="#E52532" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">⚡ COMPLEXITY &amp; INVARIANTS</text>
    <text x="20" y="60" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="13">Time: Best=O(N) [Already sorted] | Avg=O(N^2) | Worst=O(N^2) [Reverse sorted]</text>
    <text x="20" y="80" fill="#AAAAAA" font-family="'Courier New', monospace" font-size="13">Space: Aux Space=O(1) auxiliary | In-Place=YES | Stable=YES</text>
  </g>

  <!-- Handwritten Tips Footer -->
  <g transform="translate(40, 885)">
    <rect width="720" height="85" rx="8" fill="#1C1C1C" stroke="#2E2E2E" stroke-width="1"/>
    <text x="20" y="28" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">💡 KEY INTERVIEW MENTAL MODEL:</text>
    <text x="20" y="52" fill="#C0C0C0" font-family="'Courier New', monospace" font-size="12">WHY SO POPULAR IN MODERN LIBS? Fast cache performance makes it the sub-sorter for small arrays (N <= 20).</text>
    <text x="20" y="72" fill="#E52532" font-family="'Courier New', monospace" font-size="12">BINARY INSERTION SORT: Binary search can find insertion slot in O(log N), but shifting still takes O(N).</text>
  </g>
</svg>